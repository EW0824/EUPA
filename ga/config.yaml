
ga:
  num_generations: 8 # ~500 images in general
  num_parents_mating: 10
  sol_per_pop: 20
  mutation_percent_genes: 10
  init_range_low: -1.0
  init_range_high: 1.0
  parent_selection_type: "tournament"
  crossover_type: "uniform"
  crossover_probability: 0.5
  mutation_probability: 0.2

fitness:
  # perturbation_weight: 0.01
  pixel_constraint_weight: 0.5
  max_perturbation_magnitude: 85
  # epsilon: 100
  epsilon_init: 150
  epsilon_end: 50
  penalty_factor: 0.01

model:
  model_type: "vit_b_16"
  batch_size: 64

visualization:
  visualize: True
  visualize_every: 1